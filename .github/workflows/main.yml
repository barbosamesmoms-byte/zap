name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Usar a versão enviada em zip
        run: |
          ZIP=$(ls alarme-zap-v*.zip 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$ZIP" ]; then echo "Usando $ZIP"; unzip -o "$ZIP" -d .; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: alarme-apk
          path: app/build/outputs/apk/debug/app-debug.apk
